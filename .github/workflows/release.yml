name: Release

# main → build signed images → staging → (approval) → production.
# Needs, in the repository settings:
#   Environments "staging" and "production" (give production required reviewers), each with
#     secret   KUBE_CONFIG   kubeconfig of a deploy-only service account for that cluster/namespace
#     variable API_URL       e.g. https://api.staging.example.com / https://api.example.com
#     variable NAMESPACE     sss-staging / sss
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never interrupt a rollout half way

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  api-image:
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless image signing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/sss-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: true
          sbom: true
      - name: Scan the image; stop on fixable high or critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/sss-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/sss-api@${{ steps.build.outputs.digest }}

  web-images:
    name: Build ${{ matrix.app }} image (${{ matrix.environment }})
    runs-on: ubuntu-latest
    # The API address is compiled into the browser bundle, so each environment gets its own image.
    strategy:
      matrix:
        app: [dashboard, mobile]
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/sss-${{ matrix.app }}:${{ matrix.environment }}-${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_SMS_NUMBER=${{ vars.SMS_NUMBER }}
            NEXT_PUBLIC_TILES_MAP=${{ vars.TILES_MAP }}
            NEXT_PUBLIC_TILES_SATELLITE=${{ vars.TILES_SATELLITE }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.environment }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.environment }},mode=max
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/sss-${{ matrix.app }}:${{ matrix.environment }}-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/sss-${{ matrix.app }}@${{ steps.build.outputs.digest }}

  staging:
    name: Deploy to staging
    needs: [api-image, web-images]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  production:
    name: Deploy to production
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production # waits for the environment's required reviewers
    secrets: inherit
