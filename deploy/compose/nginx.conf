# Load balancer for the rehearsal stack. Docker's DNS returns every replica of a service;
# Nginx re-resolves, so `--scale api=N` is picked up without a restart.
worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  server_tokens off;
  client_max_body_size 12m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Per-address ceilings, as the ingress applies in production.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  add_header X-Served-By $upstream_addr always;

  server { # citizen and officer app
    listen 8080;
    set $up http://mobile:3000;
    location / { proxy_pass $up; }
  }

  server { # dashboard
    listen 8081;
    set $up http://dashboard:3000;
    location / { proxy_pass $up; }
  }

  server { # API
    listen 8082;
    set $up http://api:4000;
    location /auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass $up;
    }
    location / {
      limit_req zone=api burst=100 nodelay;
      proxy_pass $up;
      # Live incident streams (SSE).
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
