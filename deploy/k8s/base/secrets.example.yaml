# EXAMPLE ONLY. Not part of the kustomization and never to be committed with real values.
# Production: keep these in a secret manager (AWS Secrets Manager, Azure Key Vault, Google Secret
# Manager, Vault) and sync them with External Secrets Operator, or commit them encrypted with
# Sealed Secrets / SOPS. To create by hand:
#   kubectl -n sss create secret generic sss-api-secrets --from-env-file=prod.env
apiVersion: v1
kind: Secret
metadata:
  name: sss-api-secrets
  namespace: sss
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/erp?sslmode=require
  JWT_SECRET: "<at least 32 random characters: openssl rand -base64 48>"
  OTP_SECRET: "<at least 32 random characters, different from JWT_SECRET>"
  PAYSTACK_SECRET: "<Paystack live secret key>"
  TERMII_API_KEY: "<Termii API key>"
  TERMII_SENDER_ID: "<registered sender ID>"
  VAPID_PUBLIC_KEY: "<npx web-push generate-vapid-keys>"
  VAPID_PRIVATE_KEY: "<npx web-push generate-vapid-keys>"
  VAPID_SUBJECT: mailto:ops@example.com
  ANTHROPIC_API_KEY: "<optional: help assistant>"
