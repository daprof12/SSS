apiVersion: apps/v1
kind: Deployment
metadata:
  name: sss-mobile
  labels: { app.kubernetes.io/name: sss-mobile, app.kubernetes.io/part-of: sss }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: sss-mobile }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sss-mobile, app.kubernetes.io/part-of: sss }
    spec:
      serviceAccountName: sss-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: sss-mobile } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: sss-mobile } }
      containers:
        - name: web
          image: ghcr.io/daprof12/sss-mobile:latest # pinned to a commit by the overlay
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /app/apps/mobile/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        - name: cache
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sss-mobile
  labels: { app.kubernetes.io/name: sss-mobile }
spec:
  selector: { app.kubernetes.io/name: sss-mobile }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sss-mobile
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sss-mobile }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sss-mobile
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sss-mobile }
