apiVersion: apps/v1
kind: Deployment
metadata:
  name: sss-api
  labels: { app.kubernetes.io/name: sss-api, app.kubernetes.io/part-of: sss }
spec:
  replicas: 3 # the HorizontalPodAutoscaler owns this once it is running
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: sss-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 } # never drop capacity during a release
  template:
    metadata:
      labels: { app.kubernetes.io/name: sss-api, app.kubernetes.io/part-of: sss }
    spec:
      serviceAccountName: sss-app
      automountServiceAccountToken: false
      # Live streams (SSE) are long connections; give them time to move on shutdown.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: sss-api } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: sss-api } }
      containers:
        - name: api
          image: ghcr.io/daprof12/sss-api:latest # pinned to a commit by the overlay
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: sss-api-config }
            - secretRef: { name: sss-api-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi } # no CPU limit: throttling hurts latency more than it protects
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http } # checks the database
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Keep serving while the load balancer takes this pod out of rotation.
            preStop: { exec: { command: ["sleep", "10"] } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sss-api
  labels: { app.kubernetes.io/name: sss-api }
spec:
  selector: { app.kubernetes.io/name: sss-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sss-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sss-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # an emergency surge must be met at once
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 4, periodSeconds: 30 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 25, periodSeconds: 60 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sss-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: sss-api }
