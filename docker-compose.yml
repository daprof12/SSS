services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_only
      POSTGRES_DB: erp
    ports:
      - "54329:5432"
    volumes:
      - erp_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  erp_db:
